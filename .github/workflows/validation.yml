name: FluxWave validation

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  tests-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest pytest-timeout bandit pip-audit
      - run: python -m pytest -q --timeout=60
      - run: bandit -q -r fluxwave
      - run: pip-audit

  large-transfer-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python benchmarks/real_large_transfer.py --size-mib 128 --chunk-mib 4
