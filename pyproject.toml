[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxwave"
version = "0.3.0"
description = "Adaptive data transfer research prototype"
requires-python = ">=3.10"

[project.scripts]
fluxwave = "fluxwave.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
